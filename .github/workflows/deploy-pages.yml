name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bun run build
      # Outside Lovable, Nitro writes static files to .output/public (inside Lovable: dist/client).
      - name: Prepare static site
        run: |
          if [ -f .output/public/index.html ]; then OUT=.output/public; elif [ -f dist/client/index.html ]; then OUT=dist/client; else echo "index.html not found after build"; exit 1; fi
          rm -rf site && cp -r "$OUT" site
          cp site/index.html site/404.html
          touch site/.nojekyll
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
